<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Letter For You 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@400;600;700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ROOT VARIABLES & RESET
  ============================================================ */
  :root {
    --rose:       #e8637a;
    --rose-dark:  #c0405a;
    --rose-pale:  #fce4ec;
    --cream:      #fff8f0;
    --gold:       #d4a853;
    --gold-light: #f0d08a;
    --ink:        #4a2c35;
    --shadow:     rgba(180, 60, 90, 0.18);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    overflow-x: hidden;
    font-family: 'Lora', serif;
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd9 30%, #f48fb1 60%, #e8637a 100%);
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ============================================================
     FLOATING HEARTS (background layer)
  ============================================================ */
  #hearts-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .bg-heart {
    position: absolute;
    bottom: -80px;
    opacity: 0;
    animation: floatUp linear infinite;
    font-size: 1.4rem;
    filter: drop-shadow(0 0 6px rgba(232,99,122,0.5));
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg) scale(1);   opacity: 0; }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(-110vh) rotate(360deg) scale(0.4); opacity: 0; }
  }

  /* ============================================================
     ENVELOPE SCENE
  ============================================================ */
  #scene {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    min-height: 100vh;
  }

  /* Hint text */
  #hint {
    position: absolute;
    bottom: calc(50% - 200px);
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Dancing Script', cursive;
    font-size: 1.3rem;
    color: #fff;
    text-shadow: 0 2px 8px rgba(180,60,90,0.5);
    animation: pulseFade 2s ease-in-out infinite;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 0.5s;
  }
  #hint.hide { opacity: 0; }

  @keyframes pulseFade {
    0%,100% { opacity: 0.6; transform: translateX(-50%) translateY(0); }
    50%      { opacity: 1;   transform: translateX(-50%) translateY(-6px); }
  }

  /* Envelope wrapper */
  #envelope-wrap {
    animation: envFloat 3.5s ease-in-out infinite;
    cursor: pointer;
    transition: transform 0.3s;
    position: relative;
  }
  #envelope-wrap:hover { transform: scale(1.04); }
  #envelope-wrap.opening { animation: none; }

  @keyframes envFloat {
    0%,100% { transform: translateY(0px) rotate(-1deg); }
    50%      { transform: translateY(-18px) rotate(1deg); }
  }

  /* Envelope body */
  .envelope {
    width: 340px;
    height: 240px;
    position: relative;
    filter: drop-shadow(0 20px 40px rgba(140,30,60,0.35));
  }

  /* Back panel */
  .env-back {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #fff0f5 0%, #fdd 100%);
    border-radius: 6px 6px 8px 8px;
    box-shadow: inset 0 -4px 12px rgba(200,80,100,0.1);
  }

  /* Bottom triangle (V-shape inside) */
  .env-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 130px;
    overflow: hidden;
  }
  .env-bottom::after {
    content: '';
    position: absolute;
    bottom: 0; left: -10px; right: -10px;
    height: 200px;
    background: linear-gradient(170deg, #f9c5d0 40%, #f2879d 100%);
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  }

  /* Side triangles */
  .env-left, .env-right {
    position: absolute;
    top: 0; bottom: 30px;
    width: 50%;
  }
  .env-left  { left: 0;  clip-path: polygon(0 0, 100% 50%, 0 100%);  background: linear-gradient(180deg,#fbc8d4,#f09ab0); }
  .env-right { right: 0; clip-path: polygon(100% 0, 0 50%, 100% 100%); background: linear-gradient(180deg,#fbc8d4,#f09ab0); }

  /* Flap (top lid) */
  .env-flap {
    position: absolute;
    top: 0; left: -2px; right: -2px;
    height: 155px;
    transform-origin: top center;
    transform: rotateX(0deg);
    transition: transform 0.8s cubic-bezier(0.4,0,0.2,1);
    clip-path: polygon(0 0, 100% 0, 50% 62%);
    background: linear-gradient(160deg, #fde8ef 0%, #f9b4c8 100%);
    filter: drop-shadow(0 4px 6px rgba(180,60,90,0.2));
    z-index: 4;
  }

  /* Wax seal */
  .wax-seal {
    position: absolute;
    top: 68px;
    left: 50%;
    transform: translateX(-50%);
    width: 54px; height: 54px;
    background: radial-gradient(circle at 38% 35%, #c0405a, #8b1a2e);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    box-shadow: 0 4px 14px rgba(120,20,40,0.45), inset 0 2px 6px rgba(255,180,180,0.25);
    z-index: 5;
    transition: opacity 0.4s, transform 0.4s;
  }
  .wax-seal::before {
    content: '';
    position: absolute;
    inset: 5px;
    border: 1.5px solid rgba(255,200,200,0.35);
    border-radius: 50%;
  }

  /* Letter peek inside envelope */
  #letter-peek {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%) translateY(0);
    width: 300px;
    height: 200px;
    background: var(--cream);
    border-radius: 4px;
    transition: transform 1s cubic-bezier(0.25,0.8,0.25,1);
    z-index: 2;
    box-shadow: 0 -4px 20px rgba(200,80,100,0.15);
  }

  /* Opening state */
  #envelope-wrap.opening .env-flap {
    transform: perspective(600px) rotateX(-165deg);
  }
  #envelope-wrap.opening .wax-seal {
    opacity: 0;
    transform: translateX(-50%) scale(0.5);
  }
  #envelope-wrap.opening #letter-peek {
    transform: translateX(-50%) translateY(-260px);
  }

  /* ============================================================
     LETTER OVERLAY
  ============================================================ */
  #letter-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(240,100,130,0.08);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s;
  }
  #letter-overlay.visible {
    opacity: 1;
    pointer-events: all;
  }

  .letter-card {
    background: linear-gradient(160deg, #fffdf8 0%, #fff5f0 100%);
    border-radius: 8px;
    padding: 52px 48px 44px;
    width: min(520px, 92vw);
    position: relative;
    box-shadow:
      0 6px 60px rgba(180,60,90,0.22),
      0 2px 12px rgba(180,60,90,0.12),
      inset 0 1px 0 rgba(255,255,255,0.9);
    transform: translateY(40px) scale(0.96);
    transition: transform 0.7s cubic-bezier(0.25,0.8,0.25,1);
    overflow: hidden;
  }
  #letter-overlay.visible .letter-card {
    transform: translateY(0) scale(1);
  }

  /* Paper texture lines */
  .letter-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      transparent,
      transparent 27px,
      rgba(232,99,122,0.08) 27px,
      rgba(232,99,122,0.08) 28px
    );
    border-radius: 8px;
    pointer-events: none;
  }

  /* Corner rose decoration */
  .letter-card::after {
    content: '🌹';
    position: absolute;
    top: 16px; right: 20px;
    font-size: 1.5rem;
    opacity: 0.6;
  }

  .letter-date {
    font-family: 'Dancing Script', cursive;
    font-size: 0.95rem;
    color: var(--rose);
    margin-bottom: 18px;
    opacity: 0;
    transition: opacity 0.5s 0.3s;
  }
  #letter-overlay.visible .letter-date { opacity: 1; }

  .letter-salutation {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.45rem;
    color: var(--rose-dark);
    margin-bottom: 18px;
    line-height: 1.4;
  }

  .letter-body {
    font-family: 'Lora', serif;
    font-size: 1.05rem;
    line-height: 1.85;
    color: var(--ink);
    min-height: 140px;
  }

  /* Cursor blink */
  #cursor {
    display: inline-block;
    width: 2px; height: 1.1em;
    background: var(--rose);
    vertical-align: text-bottom;
    animation: blink 0.7s step-end infinite;
    margin-left: 1px;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 16px;
    margin-top: 32px;
    align-items: center;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .btn-row.show { opacity: 1; }

  .btn-yes, .btn-no {
    padding: 13px 32px;
    border: none;
    border-radius: 50px;
    font-family: 'Dancing Script', cursive;
    font-size: 1.3rem;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    font-weight: 600;
  }

  .btn-yes {
    background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
    color: #fff;
    box-shadow: 0 6px 20px rgba(192,64,90,0.4);
  }
  .btn-yes:hover {
    transform: translateY(-3px) scale(1.06);
    box-shadow: 0 10px 28px rgba(192,64,90,0.5);
  }

  .btn-no {
    background: #fff;
    color: var(--rose);
    border: 2px solid var(--rose-pale);
    box-shadow: 0 4px 12px rgba(200,80,100,0.1);
    position: fixed; /* will be repositioned by JS */
  }

  /* ============================================================
     BURST HEARTS (click effect)
  ============================================================ */
  .burst-heart {
    position: fixed;
    pointer-events: none;
    font-size: 1.6rem;
    z-index: 200;
    animation: burstFly 1.2s ease-out forwards;
  }
  @keyframes burstFly {
    0%   { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(var(--rot)); opacity: 0; }
  }

  /* ============================================================
     POLAROID / PHOTO REVEAL
  ============================================================ */
  #yes-overlay {
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(252,228,236,0.0);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: background 1s;
    overflow: hidden;
  }
  #yes-overlay.active {
    display: flex;
    background: rgba(252,228,236,0.95);
  }

  /* Polaroids */
  .polaroid-wrap {
    position: fixed;
    opacity: 0;
    animation: polaroidFall 0.9s cubic-bezier(0.25,0.8,0.25,1) forwards;
    z-index: 310;
    pointer-events: none;
  }
  @keyframes polaroidFall {
    0%   { transform: var(--start-transform) translateY(-120px); opacity: 0; }
    70%  { opacity: 1; }
    100% { transform: var(--end-transform); opacity: 1; }
  }

  .polaroid {
    background: #fff;
    padding: 10px 10px 32px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    border-radius: 2px;
    width: 130px;
  }
  .polaroid-img {
    width: 110px; height: 110px;
    border-radius: 1px;
    object-fit: cover;
    display: block;
  }
  .polaroid-caption {
    margin-top: 6px;
    font-family: 'Dancing Script', cursive;
    font-size: 0.8rem;
    color: #888;
    text-align: center;
  }

  /* Final message */
  #final-msg {
    position: relative;
    z-index: 320;
    text-align: center;
    padding: 36px 40px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(200,80,100,0.2);
    max-width: 480px;
    width: 90vw;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.8s, transform 0.8s;
    margin-top: 20px;
  }
  #final-msg.show { opacity: 1; transform: scale(1); }

  #final-msg h2 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.5rem;
    color: var(--rose-dark);
    line-height: 1.45;
    margin-bottom: 14px;
  }
  #final-msg p {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--ink);
    line-height: 1.7;
  }

  /* Sparkle */
  .sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 315;
    font-size: 1.1rem;
    animation: sparklePop 1.5s ease-out forwards;
  }
  @keyframes sparklePop {
    0%   { transform: scale(0) rotate(0deg);   opacity: 1; }
    50%  { transform: scale(1.4) rotate(180deg); opacity: 1; }
    100% { transform: scale(0) rotate(360deg); opacity: 0; }
  }

  /* ============================================================
     RESPONSIVE
  ============================================================ */
  @media (max-width: 520px) {
    .envelope { width: 280px; height: 196px; }
    .env-flap  { height: 126px; }
    .wax-seal  { top: 56px; width: 44px; height: 44px; font-size: 1rem; }
    #letter-peek { width: 246px; }
    #envelope-wrap.opening #letter-peek { transform: translateX(-50%) translateY(-216px); }
    .letter-card  { padding: 40px 28px 36px; }
    .letter-salutation { font-size: 1.2rem; }
    .letter-body { font-size: 0.97rem; }
    .btn-yes, .btn-no { font-size: 1.1rem; padding: 11px 24px; }
  }
</style>
</head>
<body>

<!-- ── Background hearts ───────────────────────────────────── -->
<div id="hearts-bg"></div>

<!-- ── Main scene ─────────────────────────────────────────── -->
<div id="scene">
  <p id="hint">Click the envelope 💌</p>

  <div id="envelope-wrap" onclick="openEnvelope()">
    <div class="envelope">
      <div class="env-back"></div>
      <div class="env-left"></div>
      <div class="env-right"></div>
      <div class="env-bottom"></div>

      <!-- Letter peeking inside -->
      <div id="letter-peek"></div>

      <!-- Flap -->
      <div class="env-flap"></div>

      <!-- Wax seal sits on flap fold -->
      <div class="wax-seal">❤️</div>
    </div>
  </div>
</div>

<!-- ── Letter overlay ─────────────────────────────────────── -->
<div id="letter-overlay">
  <div class="letter-card">
    <div class="letter-date" id="letter-date"></div>
    <div class="letter-salutation">My Dearest,</div>
    <div class="letter-body" id="letter-body"><span id="cursor"></span></div>
    <div class="btn-row" id="btn-row">
      <button class="btn-yes" onclick="yesClicked(event)">YES ❤️</button>
      <button class="btn-no"  id="btn-no"
              onmouseover="runAway()"
              ontouchstart="runAway()">NO 🙈</button>
    </div>
  </div>
</div>

<!-- ── YES overlay ────────────────────────────────────────── -->
<div id="yes-overlay">
  <div id="final-msg">
    <h2>You just made me the happiest person ❤️</h2>
    <p>I promise to create beautiful memories with you.<br>
       <em>Forever starts today.</em> 🌹</p>
  </div>
</div>

<script>
/* ============================================================
   1. BACKGROUND HEARTS
============================================================ */
(function spawnBgHearts() {
  const container = document.getElementById('hearts-bg');
  const symbols   = ['❤️','🩷','💕','💗','💓','🌸','✨'];

  function spawnOne() {
    const el = document.createElement('span');
    el.className  = 'bg-heart';
    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    el.style.left    = Math.random() * 100 + 'vw';
    el.style.fontSize = (0.9 + Math.random() * 1.6) + 'rem';
    const dur = 7 + Math.random() * 10;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay    = (Math.random() * 4) + 's';
    container.appendChild(el);
    setTimeout(() => el.remove(), (dur + 4) * 1000);
  }

  // Initial batch
  for (let i = 0; i < 18; i++) {
    setTimeout(spawnOne, Math.random() * 3000);
  }
  setInterval(spawnOne, 700);
})();

/* ============================================================
   2. OPEN ENVELOPE
============================================================ */
let envelopeOpened = false;

function openEnvelope() {
  if (envelopeOpened) return;
  envelopeOpened = true;

  const wrap    = document.getElementById('envelope-wrap');
  const overlay = document.getElementById('letter-overlay');
  const hint    = document.getElementById('hint');

  hint.classList.add('hide');
  wrap.classList.add('opening');

  // After letter slides up, show overlay
  setTimeout(() => {
    overlay.classList.add('visible');
    setLetterDate();
    startTyping();
    positionNoBtn();
  }, 1100);
}

/* ============================================================
   3. TYPING ANIMATION
============================================================ */
const MESSAGE = `Hey Jasleen,

From the moment we met,
my world became brighter.

You make my days happier,
my nights calmer,
and my heart fuller.

So I want to ask you something...

Will you be mine? ❤️`;

function setLetterDate() {
  const months = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  const now = new Date();
  document.getElementById('letter-date').textContent =
    months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
}

function startTyping() {
  const bodyEl  = document.getElementById('letter-body');
  const cursor  = document.getElementById('cursor');
  let   idx     = 0;
  let   textNode = document.createTextNode('');
  bodyEl.insertBefore(textNode, cursor);

  const SPEED = 38; // ms per character

  function type() {
    if (idx < MESSAGE.length) {
      textNode.nodeValue += MESSAGE[idx++];
      // Auto-scroll
      bodyEl.closest('.letter-card').scrollTop = 9999;
      setTimeout(type, MESSAGE[idx - 1] === '\n' ? 140 : SPEED);
    } else {
      // Done typing – show buttons
      cursor.remove();
      setTimeout(() => {
        document.getElementById('btn-row').classList.add('show');
      }, 400);
    }
  }
  setTimeout(type, 500);
}

/* ============================================================
   4. NO BUTTON — runs away
============================================================ */
function positionNoBtn() {
  const btn = document.getElementById('btn-no');
  // Initial natural position (near yes button)
  btn.style.position = 'fixed';
  btn.style.left     = '50%';
  btn.style.top      = '62%';
  btn.style.transform = 'translateX(80px)';
}

function runAway() {
  const btn = document.getElementById('btn-no');
  const bw  = btn.offsetWidth  || 120;
  const bh  = btn.offsetHeight || 48;
  const maxX = window.innerWidth  - bw - 20;
  const maxY = window.innerHeight - bh - 20;

  const nx = 20 + Math.random() * maxX;
  const ny = 20 + Math.random() * maxY;

  btn.style.transition = 'left 0.3s, top 0.3s';
  btn.style.left      = nx + 'px';
  btn.style.top       = ny + 'px';
  btn.style.transform = 'none';
}

/* ============================================================
   5. YES CLICKED — hearts burst + polaroids + final message
============================================================ */
function yesClicked(e) {
  // Burst hearts from click point
  spawnBurst(e.clientX, e.clientY, 28);

  // Fade in yes overlay after brief delay
  const overlay = document.getElementById('yes-overlay');
  overlay.classList.add('active');

  // Close letter
  document.getElementById('letter-overlay').style.opacity = '0';
  document.getElementById('letter-overlay').style.pointerEvents = 'none';

/* ============================================================
   6. HELPERS — burst & sparkle
============================================================ */
function spawnBurst(cx, cy, count) {
  const symbols = ['❤️','💕','🩷','💖','🌸','✨','💗'];
  for (let i = 0; i < count; i++) {
    const el  = document.createElement('span');
    el.className = 'burst-heart';
    const angle = Math.random() * Math.PI * 2;
    const dist  = 80 + Math.random() * 140;
    el.style.left   = cx + 'px';
    el.style.top    = cy + 'px';
    el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    el.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    el.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    el.style.animationDuration = (0.7 + Math.random() * 0.8) + 's';
    el.style.animationDelay    = (Math.random() * 0.3) + 's';
    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }
}

function spawnSparkle(leftCSS, topCSS) {
  const el = document.createElement('span');
  el.className  = 'sparkle';
  el.textContent = ['✨','💫','⭐','🌟'][Math.floor(Math.random() * 4)];
  el.style.left = `calc(${leftCSS} + ${Math.random() * 120}px)`;
  el.style.top  = `calc(${topCSS}  + ${Math.random() * 120}px)`;
  el.style.animationDelay = (Math.random() * 0.6) + 's';
  document.getElementById('yes-overlay').appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

/* ============================================================
   7. OPTIONAL: soft ambient tone using Web Audio API
      (plays after envelope opens — no external file needed)
============================================================ */
let audioStarted = false;

function startAmbientMusic() {
  if (audioStarted) return;
  audioStarted = true;

  try {
    const ctx    = new (window.AudioContext || window.webkitAudioContext)();
    const notes  = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
    let   noteIdx = 0;

    function playNote() {
      const osc   = ctx.createOscillator();
      const gain  = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type      = 'sine';
      osc.frequency.value = notes[noteIdx % notes.length];
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 0.3);
      gain.gain.linearRampToValueAtTime(0,    ctx.currentTime + 1.6);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 1.8);
      noteIdx++;
      setTimeout(playNote, 1200 + Math.random() * 600);
    }
    playNote();
  } catch(e) {
    // Audio not supported — fail silently
  }
}

// Start music when envelope is clicked (requires user gesture)
document.getElementById('envelope-wrap').addEventListener('click', startAmbientMusic);
